version: '3.8'

services:
  backend:
    build: ./backend
    container_name: x_growth_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:changeme@db:5432/x_growth_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: x_growth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=x_growth_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: x_growth_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
